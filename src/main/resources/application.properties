spring.application.name=drive

# Load local environment values from the project .env file.
spring.config.import=optional:file:./.env[.properties]

# PHASE 0 - EXERCISE 2: Connect Spring Boot to PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:drive}
spring.datasource.username=${POSTGRES_USER:drive}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
