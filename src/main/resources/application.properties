spring.application.name=drive

# Load local environment values from the project .env file.
spring.config.import=optional:file:./.env[.properties]

# PHASE 0 - EXERCISE 2: Connect Spring Boot to PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:drive}
spring.datasource.username=${POSTGRES_USER:drive}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# MinIO object storage. MinioProperties will bind these values.
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ROOT_USER}
app.storage.minio.secret-key=${MINIO_ROOT_PASSWORD}
app.storage.minio.bucket=${MINIO_BUCKET:drive-files}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Permanent trash cleanup. It is intentionally disabled during learning and
# local testing. Set cleanup-enabled=true only when you want the scheduled job.
app.trash.retention-days=30
app.trash.cleanup-batch-size=100
app.trash.cleanup-cron=0 0 3 * * *
app.trash.cleanup-enabled=false
